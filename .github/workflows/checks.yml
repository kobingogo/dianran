name: Reproducible checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DIANRAN_PROMPT_PIPELINE_ROOT: ${{ github.workspace }}/prompt-resources
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kobingogo/dianran-prompts
          ref: ${{ vars.PROMPT_CHECK_RESOURCE_REF || 'codex/prompt-published' }}
          path: prompt-resources
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run typecheck && bun test && bun run build
        working-directory: web
      - run: npm ci && npm test
        working-directory: canvas-agent
      - run: npm ci --prefix brand --no-audit --no-fund
      - run: node --test brand/pipeline/manifest-http.test.mjs brand/pipeline/fetch-x.test.mjs brand/pipeline/prompt-key.test.mjs brand/pipeline/redfox-x.test.mjs brand/pipeline/review-integration.test.mjs brand/pipeline/publication-flow.test.mjs && node brand/pipeline/validate.mjs
      - run: bash scripts/check-browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          include-hidden-files: true
          path: |
            .playwright-cli/*.result.json
            .playwright-cli/vite.log
            output/playwright/evidence
