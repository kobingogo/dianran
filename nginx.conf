server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /prompt-sources/ {
        proxy_pass https://dianran-prompts.vercel.app/;
        proxy_set_header Host dianran-prompts.vercel.app;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
